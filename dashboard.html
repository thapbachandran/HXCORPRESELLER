<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>𝗛𝗫 - 𝗖𝗢𝗥𝗣 𝗣𝗔𝗡𝗘𝗟 𝗨𝗦𝗘𝗥𝗦</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0077ff;
      --secondary: #0043a8;
      --success: #00b4d8;
      --danger: #ff477e;
      --warning: #ffb703;
      --info: #48cae4;
      --light: #f0f8ff;
      --dark: #03045e;
      --gray: #6c757d;
      --white: #ffffff;
      --blue-bg: #f4f8ff;
      --blue-shadow: rgba(0, 119, 255, 0.2);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); box-shadow: 0 4px 15px var(--blue-shadow); }
      50% { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0, 119, 255, 0.3); }
      100% { transform: translateY(0px); box-shadow: 0 4px 15px var(--blue-shadow); }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(-45deg, #f0f4ff, #e2ecff, #f8fbff, #eef4ff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--dark);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px;
    }

    .header {
      background-color: var(--white);
      box-shadow: 0 2px 15px var(--blue-shadow);
      padding: 10px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      background-color: transparent;
      transition: all 0.2s ease;
      gap: 6px;
    }

    .btn-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background-color: var(--light);
      color: var(--primary);
      padding: 0;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--white);
    }

    .btn-success {
      background-color: var(--success);
      color: var(--white);
      font-size: 0.8rem;
      padding: 6px 10px;
    }

    .btn-warning {
      background-color: var(--warning);
      color: var(--dark);
      font-size: 0.8rem;
      padding: 6px 10px;
    }

    .btn-danger {
      background-color: var(--danger);
      color: var(--white);
      font-size: 0.8rem;
      padding: 6px 10px;
    }

    .sidebar {
      position: fixed;
      top: 60px;
      left: -260px;
      bottom: 0;
      width: 260px;
      background-color: var(--white);
      box-shadow: 4px 0 20px var(--blue-shadow);
      transition: transform 0.3s ease-in-out;
      z-index: 900;
      overflow-y: auto;
    }

    .sidebar.active {
      transform: translateX(260px);
    }

    .sidebar-menu {
      list-style: none;
      padding: 15px 0;
    }

    .sidebar-item {
      margin-bottom: 5px;
      padding: 0 10px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: var(--gray);
      text-decoration: none;
      border-radius: 8px;
      gap: 12px;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(0, 119, 255, 0.1);
      color: var(--primary);
    }

    .main-content {
      margin-top: 65px;
      margin-left: 0;
      padding: 15px 8px;
      transition: all 0.3s ease;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 1.3rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dark);
    }

    .page-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-container {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
    }

    .search-box input {
      padding: 10px 15px 10px 40px;
      border: 1.5px solid #bde0fe;
      border-radius: 8px;
      width: 100%;
      background-color: var(--white);
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--white), #f0f7ff);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      border: 1px solid #d0e1fd;
      animation: floatCard 4s ease-in-out infinite;
    }

    .stat-card h3 {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 4px;
    }

    .stat-card p {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-icon {
      position: absolute;
      right: 15px;
      top: 15px;
      font-size: 2.2rem;
      opacity: 0.15;
      color: var(--primary);
    }

    .card {
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 15px var(--blue-shadow);
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #d0e1fd;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      background-color: var(--white);
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #bde0fe;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2ecff;
    }

    .user-header h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .user-status {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    .user-status.active { background-color: rgba(0, 180, 216, 0.15); color: var(--success); }
    .user-status.inactive { background-color: rgba(255, 71, 126, 0.15); color: var(--danger); }

    .user-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .detail-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--gray);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #bde0fe;
      border-radius: 6px;
      font-size: 13px;
      background-color: #f8fbff;
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
    }

    .creator-badge {
      font-size: 0.75rem;
      background: rgba(0, 119, 255, 0.1);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 8px;
      display: inline-block;
    }

    .user-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      border-top: 1px solid #e2ecff;
      padding-top: 10px;
      flex-wrap: wrap;
    }

    .maintenance-warning {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: var(--dark);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .custom-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.2s ease;
    }
    .custom-modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .custom-modal {
      background: var(--white);
      width: 90%;
      max-width: 320px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }
    .custom-modal h3 {
      font-size: 1.1rem;
      color: var(--dark);
      margin-bottom: 8px;
    }
    .custom-modal p {
      font-size: 0.9rem;
      color: var(--gray);
      margin-bottom: 20px;
    }
    .custom-modal-actions {
      display: flex;
      gap: 10px;
    }
    .custom-modal-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .modal-btn-cancel {
      background-color: var(--light);
      color: var(--gray);
    }
    .modal-btn-ok {
      background-color: var(--danger);
      color: var(--white);
    }

    @media (min-width: 768px) {
      .sidebar { left: 0; }
      .sidebar.active { transform: translateX(-260px); }
      .main-content { margin-left: 260px; padding: 25px; }
      .main-content.full-width { margin-left: 0; }
      .page-header { flex-direction: row; justify-content: space-between; align-items: center; }
      .page-actions { flex-direction: row; align-items: center; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .user-details { display: grid; grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-left">
        <button class="btn btn-icon" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="header-title">
          <i class="fas fa-users-cog"></i>
          <span>𝗛𝗫 - 𝗖𝗢𝗥𝗣 𝗣𝗔𝗡𝗘𝗟 𝗨𝗦𝗘𝗥𝗦</span>
        </h1>
      </div>
      <div class="header-actions">
        <div class="user-avatar">
          <img src="./logo.png" alt="Admin" width="35" height="35" style="border: 2px solid var(--primary); border-radius: 50%;" onerror="this.src='logo.png'">
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar: Notification option removed -->
  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="./index.html" class="sidebar-link">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="./admin.html" class="sidebar-link">
          <i class="fas fa-user-plus"></i>
          <span>Add User</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="./dashboard.html" class="sidebar-link active">
          <i class="fas fa-users-cog"></i>
          <span>Manage Users</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="./settings.html" class="sidebar-link">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">
          <i class="fas fa-users-cog"></i>
          User Management
        </h1>
        <div class="page-actions">
          <div class="filter-container">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="searchInput" placeholder="Search users...">
            </div>
          </div>
          <button class="btn btn-primary" onclick="window.location.href='./admin.html'">
            <i class="fas fa-user-plus"></i> Add User
          </button>
        </div>
      </div>

      <div id="maintenanceWarning" class="maintenance-warning" style="display: none;">
        <i class="fas fa-exclamation-triangle"></i> Maintenance Mode Active.
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Users</h3>
          <p id="totalUsers">0</p>
          <i class="fas fa-users stat-icon"></i>
        </div>
        <div class="stat-card">
          <h3>Active Users</h3>
          <p id="activeUsers">0</p>
          <i class="fas fa-user-check stat-icon"></i>
        </div>
        <div class="stat-card">
          <h3>Inactive Users</h3>
          <p id="inactiveUsers">0</p>
          <i class="fas fa-user-slash stat-icon"></i>
        </div>
      </div>

      <div class="card">
        <div id="userList" class="user-list">
          <div class="loading" style="color: var(--primary); text-align: center; padding: 15px; font-size: 14px;">
            <i class="fas fa-spinner fa-spin"></i> Loading users...
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="custom-modal-overlay" id="deleteModal">
    <div class="custom-modal">
      <h3 id="modalTitle">Confirm Delete</h3>
      <p id="deleteModalText">Are you sure you want to delete this user?</p>
      <div class="custom-modal-actions">
        <button class="modal-btn-cancel" id="cancelDeleteBtn">Cancel</button>
        <button class="modal-btn-ok" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { ref, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      if(window.innerWidth >= 768) {
        mainContent.classList.toggle('full-width');
      }
    });

    const maintenanceWarning = document.getElementById('maintenanceWarning');
    const addUserButton = document.querySelector('.page-actions .btn-primary');

    const settingsRef = ref(db, 'settings/maintenanceMode');
    onValue(settingsRef, (snapshot) => {
      const inMaintenance = snapshot.val();
      if (inMaintenance) {
        maintenanceWarning.style.display = 'block';
        if(addUserButton) addUserButton.disabled = true;
      } else {
        maintenanceWarning.style.display = 'none';
        if(addUserButton) addUserButton.disabled = false;
        loadUsers();
      }
    });

    const userListEl = document.getElementById('userList');
    const searchInput = document.getElementById('searchInput');
    let allUsers = {};
    const loggedInReseller = localStorage.getItem("loggedInReseller") || sessionStorage.getItem("loggedInReseller") || "";

    function loadUsers() {
      const usersRef = ref(db, "userinfo");
      get(usersRef).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          
          allUsers = {};
          Object.entries(data).forEach(([username, user]) => {
            const creator = user.createdBy || 'Admin';
            if (!loggedInReseller || creator.toLowerCase() === loggedInReseller.toLowerCase()) {
              allUsers[username] = user;
            }
          });

          renderUsers(allUsers);
          updateStats(allUsers);
        } else {
          userListEl.innerHTML = '<div style="text-align:center; color:var(--gray); font-size:14px;">No users found.</div>';
          updateStats({});
        }
      }).catch((error) => {
        userListEl.innerHTML = `<div style="color:var(--danger); text-align:center; font-size:14px;">Error: ${error.message}</div>`;
      });
    }

    function updateStats(users) {
      const usersArray = Object.values(users);
      const total = usersArray.length;
      const active = usersArray.filter(u => u.status === 'active').length;
      const inactive = total - active;

      document.getElementById('totalUsers').innerText = total;
      document.getElementById('activeUsers').innerText = active;
      document.getElementById('inactiveUsers').innerText = inactive;
    }

    function renderUsers(users) {
      if (Object.keys(users).length === 0) {
        userListEl.innerHTML = '<div style="text-align:center; color:var(--gray); font-size:14px;">No users found created by your account.</div>';
        return;
      }

      userListEl.innerHTML = '';
      Object.entries(users).forEach(([username, user]) => {
        const createdByText = user.createdBy ? user.createdBy : 'Admin';
        const isUserActive = user.status === 'active';

        const userCard = document.createElement('div');
        userCard.className = 'user-card';
        userCard.innerHTML = `
          <div class="user-header">
            <h3><i class="fas fa-user-circle" style="color: var(--primary); margin-right: 4px;"></i> ${username}</h3>
            <span class="user-status ${user.status || 'inactive'}">
              <i class="fas fa-circle" style="font-size: 6px;"></i> ${user.status || 'inactive'}
            </span>
          </div>

          <div class="creator-badge">
            <i class="fas fa-user-shield"></i> Created By: ${createdByText}
          </div>
          
          <div class="user-details">
            <div class="detail-group">
              <label>Password</label>
              <div class="password-container">
                <input type="password" id="password-${username}" value="${user.password || ''}" class="form-control">
                <button class="toggle-password" data-target="password-${username}" type="button">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>
            
            <div class="detail-group">
              <label>Status</label>
              <select id="status-${username}" class="form-control">
                <option value="active" ${user.status === 'active' ? 'selected' : ''}>Active</option>
                <option value="inactive" ${user.status === 'inactive' ? 'selected' : ''}>Inactive</option>
              </select>
            </div>
          </div>

          <div class="user-actions">
            <button class="btn btn-success save-btn" data-username="${username}" type="button">
              <i class="fas fa-save"></i> Save
            </button>
            <button class="btn ${isUserActive ? 'btn-warning' : 'btn-success'} toggle-ban-btn" data-username="${username}" data-newstatus="${isUserActive ? 'inactive' : 'active'}" type="button">
              <i class="fas ${isUserActive ? 'fa-ban' : 'fa-check-circle'}"></i> ${isUserActive ? 'Block' : 'Unblock'}
            </button>
            <button class="btn btn-danger delete-btn" data-username="${username}" type="button">
              <i class="fas fa-trash-alt"></i> Delete
            </button>
          </div>
        `;
        userListEl.appendChild(userCard);
      });
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = {};
      Object.entries(allUsers).forEach(([username, user]) => {
        if (username.toLowerCase().includes(query)) {
          filtered[username] = user;
        }
      });
      renderUsers(filtered);
    });

    userListEl.addEventListener('click', (e) => {
      const targetBtn = e.target.closest('button');
      if (!targetBtn) return;

      if (targetBtn.classList.contains('toggle-password')) {
        const inputId = targetBtn.getAttribute('data-target');
        const passInput = document.getElementById(inputId);
        const icon = targetBtn.querySelector('i');
        if (passInput.type === 'password') {
          passInput.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          passInput.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      }

      if (targetBtn.classList.contains('save-btn')) {
        const username = targetBtn.getAttribute('data-username');
        const newPassword = document.getElementById(`password-${username}`).value.trim();
        const newStatus = document.getElementById(`status-${username}`).value;

        const userRef = ref(db, `userinfo/${username}`);
        update(userRef, { password: newPassword, status: newStatus })
          .then(() => alert('User updated successfully!'))
          .catch((err) => alert('Error updating user: ' + err.message));
      }

      if (targetBtn.classList.contains('toggle-ban-btn')) {
        const username = targetBtn.getAttribute('data-username');
        const newStatus = targetBtn.getAttribute('data-newstatus');

        const userRef = ref(db, `userinfo/${username}`);
        update(userRef, { status: newStatus })
          .then(() => loadUsers())
          .catch((err) => alert('Error changing status: ' + err.message));
      }

      if (targetBtn.classList.contains('delete-btn')) {
        const username = targetBtn.getAttribute('data-username');
        openDeleteModal(username);
      }
    });

    const deleteModal = document.getElementById('deleteModal');
    const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
    const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
    let userToDelete = null;

    function openDeleteModal(username) {
      userToDelete = username;
      document.getElementById('deleteModalText').innerText = `Are you sure you want to delete user "${username}"?`;
      deleteModal.classList.add('active');
    }

    function closeDeleteModal() {
      userToDelete = null;
      deleteModal.classList.remove('active');
    }

    cancelDeleteBtn.addEventListener('click', closeDeleteModal);

    confirmDeleteBtn.addEventListener('click', () => {
      if (userToDelete) {
        const userRef = ref(db, `userinfo/${userToDelete}`);
        remove(userRef)
          .then(() => {
            closeDeleteModal();
            loadUsers();
          })
          .catch((err) => alert('Error deleting user: ' + err.message));
      }
    });
  </script>
</body>
</html>
