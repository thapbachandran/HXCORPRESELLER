<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>𝗔𝗗𝗗 𝗡𝗘𝗪 𝗣𝗔𝗡𝗘𝗟 𝗨𝗦𝗘𝗥 </title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0077ff;
      --secondary: #0043a8;
      --success: #00b4d8;
      --danger: #ff477e;
      --warning: #ffb703;
      --info: #48cae4;
      --light: #f0f8ff;
      --dark: #03045e;
      --gray: #6c757d;
      --white: #ffffff;
      --blue-bg: #f4f8ff;
      --blue-shadow: rgba(0, 119, 255, 0.2);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(-45deg, #f0f4ff, #e2ecff, #f8fbff, #eef4ff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--dark);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 12px;
    }

    .header {
      background-color: var(--white);
      box-shadow: 0 2px 15px var(--blue-shadow);
      padding: 10px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--secondary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background-color: transparent;
      transition: all 0.2s ease;
    }

    .btn-icon {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background-color: var(--light);
      color: var(--primary);
      padding: 0;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--white);
    }

    .btn-block {
      width: 100%;
    }

    .sidebar {
      position: fixed;
      top: 60px;
      left: -260px;
      bottom: 0;
      width: 260px;
      background-color: var(--white);
      box-shadow: 4px 0 20px var(--blue-shadow);
      transition: transform 0.3s ease-in-out;
      z-index: 900;
      overflow-y: auto;
    }

    .sidebar.active {
      transform: translateX(260px);
    }

    .sidebar-menu {
      list-style: none;
      padding: 15px 0;
    }

    .sidebar-item {
      margin-bottom: 5px;
      padding: 0 10px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: var(--gray);
      text-decoration: none;
      border-radius: 8px;
      gap: 12px;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(0, 119, 255, 0.1);
      color: var(--primary);
    }

    .main-content {
      margin-top: 65px;
      margin-left: 0;
      padding: 15px 8px;
      transition: all 0.3s ease;
    }

    .card {
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 15px var(--blue-shadow);
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #d0e1fd;
    }

    .credit-badge-box {
      background: linear-gradient(135deg, rgba(0, 119, 255, 0.1), rgba(0, 180, 216, 0.15));
      border: 1px solid var(--success);
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: var(--dark);
    }

    .credit-badge-box span {
      color: var(--primary);
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--dark);
      font-size: 0.85rem;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #bde0fe;
      border-radius: 8px;
      font-size: 14px;
      background-color: #f8fbff;
    }

    .form-control:focus {
      border-color: var(--primary);
      outline: none;
      background-color: var(--white);
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--primary);
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-check-input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .form-check-label {
      font-weight: 500;
      color: var(--dark);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .form-result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
      font-size: 0.85rem;
    }

    .form-result.success {
      background-color: rgba(0, 180, 216, 0.15);
      color: var(--success);
      border: 1px solid rgba(0, 180, 216, 0.3);
    }

    .form-result.error {
      background-color: rgba(255, 71, 126, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 71, 126, 0.3);
    }

    .maintenance-warning {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: var(--dark);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
    }

    @media (min-width: 768px) {
      .sidebar { left: 0; }
      .sidebar.active { transform: translateX(-260px); }
      .main-content { margin-left: 260px; padding: 25px; }
      .main-content.full-width { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-left">
        <button class="btn btn-icon" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="header-title">
          <i class="fas fa-user-plus"></i>
          <span>Add New User</span>
        </h1>
      </div>
      <div class="header-actions">
        <div class="user-avatar">
          <img src="./logo.png" alt="Admin" width="35" height="35" style="border: 2px solid var(--primary); border-radius: 50%;" onerror="this.src='logo.png'">
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar: Notification option removed -->
  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="./index.html" class="sidebar-link">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="./admin.html" class="sidebar-link active">
          <i class="fas fa-user-plus"></i>
          <span>Add User</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="./dashboard.html" class="sidebar-link">
          <i class="fas fa-users-cog"></i>
          <span>Manage Users</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="./settings.html" class="sidebar-link">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="container">
      <div id="maintenanceWarning" class="maintenance-warning" style="display: none;">
        <i class="fas fa-exclamation-triangle"></i> Site is currently in Maintenance Mode.
      </div>

      <div class="card">
        <div class="credit-badge-box">
          <div><i class="fas fa-coins" style="color: var(--warning); margin-right: 5px;"></i> Available Credit:</div>
          <span id="availableCredit">0 Credits</span>
        </div>

        <form id="addUserForm">
          <div class="form-group">
            <label for="username" class="label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" required>
          </div>
          
          <div class="form-group">
            <label for="password" class="label">Password</label>
            <div class="password-container">
              <input type="password" id="password" class="form-control" placeholder="Enter password" required>
              <button type="button" class="toggle-password">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="form-group">
            <label for="creditCost" class="label">Validity / Credits (1 Credit = 1 Day)</label>
            <select id="creditCost" class="form-control" required>
              <option value="1">1 Credit (1 Day)</option>
              <option value="3">3 Credits (3 Days)</option>
              <option value="7">7 Credits (7 Days)</option>
              <option value="15">15 Credits (15 Days)</option>
              <option value="30">30 Credits (30 Days)</option>
            </select>
          </div>
          
          <div class="form-group">
            <label class="label">Status</label>
            <div class="form-check">
              <input type="checkbox" id="statusCheckbox" class="form-check-input" checked>
              <label for="statusCheckbox" class="form-check-label">Active User</label>
            </div>
          </div>
          
          <div class="form-group">
            <label class="label">Device Access</label>
            <div class="radio-group">
              <div class="form-check">
                <input type="radio" id="device1" name="access" value="1" class="form-check-input" checked>
                <label for="device1" class="form-check-label">1 Device</label>
              </div>
              <div class="form-check">
                <input type="radio" id="device2" name="access" value="2" class="form-check-input">
                <label for="device2" class="form-check-label">2 Devices</label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            <i class="fas fa-user-plus"></i> Add User & Deduct Credit
          </button>
          
          <div id="result" class="form-result"></div>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      if(window.innerWidth >= 768) {
        mainContent.classList.toggle('full-width');
      }
    });

    const togglePasswordBtn = document.querySelector('.toggle-password');
    const passwordInput = document.getElementById('password');

    togglePasswordBtn.addEventListener('click', () => {
      const icon = togglePasswordBtn.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });

    const rawReseller = localStorage.getItem("loggedInReseller") || sessionStorage.getItem("loggedInReseller") || "Admin";
    const currentReseller = rawReseller.replace(/\./g, '_');
    
    const adminCreditRef = ref(db, `resellers/${currentReseller}/balance`);
    let currentAvailableCredits = 0;
    const availableCreditEl = document.getElementById('availableCredit');

    onValue(adminCreditRef, (snapshot) => {
      if (snapshot.exists()) {
        currentAvailableCredits = parseInt(snapshot.val(), 10) || 0;
        availableCreditEl.textContent = currentAvailableCredits + " Credits";
      } else {
        currentAvailableCredits = 0;
        availableCreditEl.textContent = "0 Credits";
      }
    });

    const addUserForm = document.getElementById('addUserForm');
    const resultEl = document.getElementById('result');

    addUserForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      const selectedDevice = document.querySelector('input[name="access"]:checked').value;
      const creditCost = parseInt(document.getElementById('creditCost').value, 10);
      const isActive = document.getElementById('statusCheckbox').checked;
      const status = isActive ? 'active' : 'inactive';
      
      if (!username || !password) {
        showResult('Please fill all fields', 'error');
        return;
      }

      if (currentAvailableCredits < creditCost) {
        showResult('Error: Insufficient credits to create user!', 'error');
        return;
      }

      const daysToAdd = creditCost; 
      const validityDate = new Date();
      validityDate.setDate(validityDate.getDate() + daysToAdd);

      const pad = n => n.toString().padStart(2, '0');
      const formattedDate = `${pad(validityDate.getDate())}-${pad(validityDate.getMonth() + 1)}-${validityDate.getFullYear()} ${pad(validityDate.getHours())}:${pad(validityDate.getMinutes())}`;
      
      const now = new Date();
      const rgtime = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

      try {
        const userRef = ref(db, `userinfo/${username}`);
        await set(userRef, {
          username: username,
          password: password,
          status: status,
          validity: formattedDate,
          access: selectedDevice,
          device: 'null',
          rgtime: rgtime,
          creditUsed: creditCost,
          createdBy: rawReseller 
        });

        const newCreditBalance = currentAvailableCredits - creditCost;
        await set(adminCreditRef, newCreditBalance);

        showResult(`User added successfully! ${creditCost} Credit(s) deducted.`, 'success');
        addUserForm.reset();

      } catch (error) {
        showResult('Error: ' + error.message, 'error');
      }
    });

    function showResult(message, type) {
      resultEl.textContent = message;
      resultEl.className = `form-result ${type}`;
      setTimeout(() => {
        resultEl.textContent = '';
        resultEl.className = 'form-result';
      }, 4000);
    }

    const maintenanceWarning = document.getElementById('maintenanceWarning');
    const settingsRef = ref(db, 'settings/maintenanceMode');
    onValue(settingsRef, (snapshot) => {
      if (snapshot.val()) {
        maintenanceWarning.style.display = 'block';
      } else {
        maintenanceWarning.style.display = 'none';
      }
    });
  </script>
</body>
</html>
