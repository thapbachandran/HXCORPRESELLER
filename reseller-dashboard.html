<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝗛𝗫 - 𝗖𝗢𝗥𝗣 𝗥𝗘𝗦𝗘𝗟𝗟𝗘𝗥 𝗪𝗘𝗕𝗦𝗜𝗧𝗘</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0077ff;
      --secondary: #0043a8;
      --success: #00b4d8;
      --danger: #ff477e;
      --warning: #ffb703;
      --info: #48cae4;
      --light: #f0f8ff;
      --dark: #03045e;
      --gray: #6c757d;
      --white: #ffffff;
      --blue-bg: #f4f8ff;
      --blue-shadow: rgba(0, 119, 255, 0.2);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); box-shadow: 0 4px 15px var(--blue-shadow); }
      50% { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0, 119, 255, 0.35); }
      100% { transform: translateY(0px); box-shadow: 0 4px 15px var(--blue-shadow); }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s ease-in-out;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(-45deg, #f0f4ff, #e2ecff, #f8fbff, #eef4ff);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--dark);
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .header {
      background-color: var(--white);
      box-shadow: 0 4px 20px var(--blue-shadow);
      padding: 15px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .user-avatar-container {
      position: relative;
      cursor: pointer;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      box-shadow: 0 2px 8px var(--blue-shadow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background-color: transparent;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--light);
      color: var(--primary);
      border: 1px solid #d0e1fd;
    }

    .btn-icon:hover {
      background-color: var(--primary);
      color: var(--white);
    }

    .sidebar {
      position: fixed;
      top: 70px;
      left: 0;
      bottom: 0;
      width: 250px;
      background-color: var(--white);
      box-shadow: 4px 0 20px var(--blue-shadow);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 900;
      overflow-y: auto;
    }

    .sidebar.active {
      transform: translateX(-250px);
    }

    .sidebar-menu {
      list-style: none;
      padding: 20px 0;
    }

    .sidebar-item {
      margin-bottom: 8px;
      padding: 0 15px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: var(--gray);
      text-decoration: none;
      border-radius: 8px;
      gap: 12px;
      font-weight: 500;
    }

    .sidebar-link:hover, .sidebar-link.active {
      background: linear-gradient(135deg, rgba(0, 119, 255, 0.1), rgba(0, 67, 168, 0.15));
      color: var(--primary);
      transform: translateX(6px);
    }

    .main-content {
      margin-top: 70px;
      margin-left: 250px;
      padding: 30px;
      transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .main-content.full-width {
      margin-left: 0;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--dark);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--white), #f0f7ff);
      border-radius: 14px;
      padding: 22px;
      position: relative;
      border: 1px solid #d0e1fd;
      animation: floatCard 4s ease-in-out infinite;
    }

    .stat-card h3 {
      font-size: 0.95rem;
      color: var(--gray);
      margin-bottom: 8px;
    }

    .stat-card p {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-icon {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 2.8rem;
      opacity: 0.15;
      color: var(--primary);
    }

    .card {
      background-color: var(--white);
      border-radius: 14px;
      box-shadow: 0 6px 20px var(--blue-shadow);
      padding: 25px;
      margin-bottom: 25px;
      border: 1px solid #d0e1fd;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2ecff;
      color: var(--dark);
    }

    .user-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 15px;
    }

    .user-card {
      background-color: var(--white);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.03);
      border: 1px solid #bde0fe;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2ecff;
    }

    .user-header h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--dark);
    }

    .user-status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .user-status.active {
      background-color: rgba(0, 180, 216, 0.15);
      color: var(--success);
    }

    .user-status.inactive {
      background-color: rgba(255, 71, 126, 0.15);
      color: var(--danger);
    }

    .user-details {
      font-size: 0.85rem;
      color: var(--gray);
    }

    .user-detail {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .user-detail strong {
      color: var(--dark);
    }

    .protected-badge {
      font-size: 0.75rem;
      background: #e2ecff;
      color: var(--secondary);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
    }

    .creator-badge {
      font-size: 0.75rem;
      background: rgba(0, 119, 255, 0.1);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 10px;
      display: inline-block;
    }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-250px); }
      .sidebar.active { transform: translateX(0); }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header-left">
        <button class="btn btn-icon" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="header-title">
          <i class="fas fa-store"></i>
          <span>𝗛𝗫 - 𝗖𝗢𝗥𝗣 𝗥𝗘𝗦𝗘𝗟𝗟𝗘𝗥</span>
        </h1>
      </div>
      <div class="header-actions">
        <div class="user-avatar-container" title="Reseller Account">
          <img src="./logo.png" alt="Reseller Logo" class="user-avatar" id="resellerLogoImg" onerror="this.src='logo.png'">
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar: Notification option removed -->
  <aside class="sidebar" id="sidebar">
    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="index.html" class="sidebar-link active">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="admin.html" class="sidebar-link">
          <i class="fas fa-user-plus"></i>
          <span>Add User</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="dashboard.html" class="sidebar-link">
          <i class="fas fa-users-cog"></i>
          <span>Manage Users</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="settings.html" class="sidebar-link">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </aside>

  <main class="main-content" id="mainContent">
    <div class="container">
      <h1 class="page-title">
        <i class="fas fa-tachometer-alt"></i>
        𝗛𝗫 - 𝗖𝗢𝗥𝗣 𝗢𝗩𝗘𝗥𝗩𝗜𝗘𝗪
      </h1>
      
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Users</h3>
          <p id="totalUsers">0</p>
          <i class="fas fa-users stat-icon"></i>
        </div>
        <div class="stat-card">
          <h3>Active Users</h3>
          <p id="activeUsers">0</p>
          <i class="fas fa-user-check stat-icon"></i>
        </div>
        <div class="stat-card">
          <h3>Inactive Users</h3>
          <p id="inactiveUsers">0</p>
          <i class="fas fa-user-slash stat-icon"></i>
        </div>
        <div class="stat-card">
          <h3>Today's Logins</h3>
          <p id="todayLogins">0</p>
          <i class="fas fa-sign-in-alt stat-icon"></i>
        </div>
      </div>

      <div class="card">
        <h2>User List (Secure View)</h2>
        <div id="userList" class="user-list">
          <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading users...</div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const mainContent = document.getElementById('mainContent');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('active');
      mainContent.classList.toggle('full-width');
    });

    const loggedInReseller = (localStorage.getItem("loggedInReseller") || sessionStorage.getItem("loggedInReseller") || "").trim();

    // ইউজার লিস্ট লোড ও ফিল্টারিং
    const usersRef = ref(db, 'userinfo/');
    onValue(usersRef, (snapshot) => {
      const data = snapshot.val();
      let total = 0, active = 0, inactive = 0;
      const userListEl = document.getElementById('userList');

      if (data) {
        userListEl.innerHTML = '';
        let usersArray = [];

        Object.entries(data).forEach(([key, value]) => {
          if (value && typeof value === 'object' && (value.password || value.status || value.createdBy)) {
            usersArray.push({ username: key, ...value });
          } else if (value && typeof value === 'object') {
            Object.entries(value).forEach(([subKey, subVal]) => {
              if (subVal && typeof subVal === 'object') {
                usersArray.push({ username: subKey, ...subVal, parentCreator: key });
              }
            });
          }
        });

        usersArray.forEach(user => {
          const creator = user.createdBy || user.parentCreator || 'Unknown';

          if (loggedInReseller && creator.toLowerCase() !== loggedInReseller.toLowerCase()) {
            return; 
          }

          total++;
          if (user.status === 'active') active++;
          else inactive++;

          const userCard = document.createElement('div');
          userCard.className = 'user-card';
          
          userCard.innerHTML = `
            <div class="user-header">
              <h3><i class="fas fa-user-circle" style="color: var(--primary); margin-right: 6px;"></i> ${user.username} ${user.access === '∞' ? '<span class="protected-badge">Protected</span>' : ''}</h3>
              <span class="user-status ${user.status || 'inactive'}">
                <i class="fas fa-circle" style="font-size:6px;"></i> ${user.status || 'inactive'}
              </span>
            </div>
            
            <div class="creator-badge">
              <i class="fas fa-envelope"></i> Creator: ${creator}
            </div>

            <div class="user-details">
              <div class="user-detail"><strong>Password:</strong> <span>${user.password || 'N/A'}</span></div>
              <div class="user-detail"><strong>Valid Until:</strong> <span>${user.validity || 'N/A'}</span></div>
              <div class="user-detail"><strong>Access:</strong> <span>${user.access === '∞' ? 'Unlimited Devices' : '1 Device'}</span></div>
            </div>
          `;
          userListEl.appendChild(userCard);
        });

        if (total === 0) {
          userListEl.innerHTML = '<div style="color:var(--gray); text-align:center; width:100%; grid-column: 1 / -1;">No users found created by this reseller.</div>';
        }
      } else {
        userListEl.innerHTML = '<div style="color:var(--gray); text-align:center; width:100%; grid-column: 1 / -1;">No users found</div>';
      }

      document.getElementById('totalUsers').textContent = total;
      document.getElementById('activeUsers').textContent = active;
      document.getElementById('inactiveUsers').textContent = inactive;
    });
  </script>
</body>
</html>
